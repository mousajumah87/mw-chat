name: mw
description: "MW Chat – modern private messaging app. Copyright ©2025 Mousa Abu Hilal."
publish_to: 'none'

version: 1.0.8+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -------------------------
  # Firebase
  # -------------------------
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_database: ^12.1.2
  firebase_messaging: ^16.1.1
  cloud_functions: ^6.0.6
  firebase_app_check: ^0.4.1+4

  # -------------------------
  # Your NEW phone/auth deps (fixes your compile errors)
  # -------------------------
  country_picker: ^2.0.27
  phone_numbers_parser: ^9.0.20

  # -------------------------
  # App utilities
  # -------------------------
  intl: ^0.20.2
  http: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  url_launcher: ^6.3.0
  google_fonts: ^8.0.0

  # -------------------------
  # Media / Files
  # -------------------------
  image_picker: ^1.2.1
  file_picker: ^10.3.8
  image: ^4.7.2
  cached_network_image: ^3.4.0
  transparent_image: ^2.0.1
  record: ^6.1.2
  audioplayers: ^6.5.1
  video_player: ^2.10.1
  video_thumbnail: ^0.5.3
  wechat_assets_picker: ^10.1.0
  flutter_webrtc: ^1.2.1
  firebase_auth_platform_interface: ^8.1.3

  # -------------------------
  # Notifications
  # -------------------------
  flutter_local_notifications: ^17.2.2
  flutter_app_badger: ^1.5.0

  # -------------------------
  # UI / UX helpers
  # -------------------------
  share_plus: ^12.0.1
  vibration: ^3.1.4
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/logo/mw_mark.png
    - assets/logo/mw_mark_transparent.png
    - assets/images/mw_bg.png
    - assets/images/bear.png
    - assets/images/smurf.png
    - assets/typing/bear_keyboard.png
    - assets/typing/smurf_keyboard.png
    - assets/emojis/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/mw_mark.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/logo/mw_mark.png"

flutter_native_splash:
  color: "#0E0E0E"
  image: assets/logo/mw_mark_transparent.png
  android: true
  ios: true
  web: true
  fullscreen: true

  image_dark: assets/logo/mw_mark_transparent.png

  android_12:
    image: assets/logo/mw_mark_transparent.png
    icon_background_color: "#0E0E0E"